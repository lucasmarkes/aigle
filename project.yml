name: Aigle
options:
  bundleIdPrefix: cool.aigle
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_ENHANCED_SECURITY: YES
    ENABLE_POINTER_AUTHENTICATION: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    GCC_NO_COMMON_BLOCKS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Aigle:
    type: application
    platform: macOS
    sources:
      - path: Aigle
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
          - "Resources/Aigle.entitlements"
      # Bundled so the setup assistant can reveal it for "Load unpacked" in Chrome.
      - path: extension
        type: folder
        buildPhase: resources
    dependencies:
      - target: AigleSafari
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.aigle.Aigle
        PRODUCT_NAME: Aigle
        INFOPLIST_FILE: Aigle/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Aigle/Resources/Aigle.entitlements
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    scheme:
      testTargets:
        - AigleTests
      gatherCoverageData: false

  AigleSafari:
    type: app-extension
    platform: macOS
    sources:
      - path: AigleSafari
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "AigleSafari.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.aigle.Aigle.Safari
        ENABLE_ENHANCED_SECURITY: NO
        ENABLE_POINTER_AUTHENTICATION: NO
        PRODUCT_NAME: AigleSafari
        INFOPLIST_FILE: AigleSafari/Info.plist
        CODE_SIGN_ENTITLEMENTS: AigleSafari/AigleSafari.entitlements
        SKIP_INSTALL: YES

  AigleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AigleTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Aigle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.aigle.AigleTests
        # Enhanced Security doesn't apply to test bundles, but pointer
        # authentication must stay ON: the bundle is dlopen'd by the app, so its
        # architecture has to match the arm64e host.
        ENABLE_ENHANCED_SECURITY: NO
        GENERATE_INFOPLIST_FILE: YES
